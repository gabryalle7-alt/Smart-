name: Build ProfitRide APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create project files with Python
        run: |
          python3 - <<'PYEOF'
          import os

          def w(path, text):
              d = os.path.dirname(path)
              if d: os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text.strip() + '\n')

          w('README.md', '# ProfitRide\nAplicatie pentru calculat profitul curselor.')
          w('local.properties', f'sdk.dir={os.environ["ANDROID_HOME"]}')
          w('gradle.properties', 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8')
          w('settings.gradle', '''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ProfitRide"
          include ':app'
          ''')
          w('build.gradle', 'plugins { id "com.android.application" version "8.2.2" apply false\n id "org.jetbrains.kotlin.android" version "1.9.22" apply false }')
          w('app/build.gradle', '''
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'ro.profitride'; compileSdk 34
              defaultConfig { applicationId "ro.profitride"; minSdk 24; targetSdk 34; versionCode 19; versionName "3.4" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
          }
          ''')

          w('app/src/main/AndroidManifest.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_car"
                  android:label="ProfitRide"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity"/>
                  <activity android:name=".SetupActivity"/>
                  <activity android:name=".SummaryActivity"/>
                  <activity android:name=".VehicleActivity"/>
                  <service android:name=".OfferReader" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          ''')

          # ICONITA 3D ROTUNJITA (fara gradiente, doar straturi solide)
          w('app/src/main/res/drawable/ic_car.xml', '''
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#1976D2" android:strokeWidth="4"
                  android:pathData="M16,4 Q4,4 4,16 L4,92 Q4,104 16,104 L92,104 Q104,104 104,92 L104,16 Q104,4 92,4 Z"/>
              <path android:fillColor="#E3F2FD" android:pathData="M18,6 Q6,6 6,18 L6,90 Q6,102 18,102 L90,102 Q102,102 102,90 L102,18 Q102,6 90,6 Z"/>
              <path android:fillColor="#33000000" android:pathData="M20,82 a34,6 0 1,0 68,0 a34,6 0 1,0 -68,0"/>
              <path android:fillColor="#D32F2F" android:pathData="M20,65 h68 v10 a5,5 0 0,1 -5,5 h-58 a5,5 0 0,1 -5,-5 z"/>
              <path android:fillColor="#B71C1C" android:pathData="M30,45 h48 l12,20 h-72 z"/>
              <path android:fillColor="#1E1E1E" android:pathData="M35,48 h16 v12 h-22 z"/>
              <path android:fillColor="#1E1E1E" android:pathData="M56,48 h14 l7,12 h-21 z"/>
              <path android:fillColor="#55FFFFFF" android:pathData="M36,49 h14 v3 h-20 z"/>
              <path android:fillColor="#111111" android:pathData="M35,80 m-10,0 a10,10 0 1,1 20,0 a10,10 0 1,1 -20,0"/>
              <path android:fillColor="#9E9E9E" android:pathData="M35,80 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0"/>
              <path android:fillColor="#111111" android:pathData="M73,80 m-10,0 a10,10 0 1,1 20,0 a10,10 0 1,1 -20,0"/>
              <path android:fillColor="#9E9E9E" android:pathData="M73,80 m-4,0 a4,4 0 1,1 8,0 a4,4 0 1,1 -8,0"/>
              <path android:strokeColor="#003300" android:strokeWidth="6" android:strokeLineCap="round"
                  android:pathData="M56,54 v14 M50,57 h8 a2,2 0 0,1 0,4 h-4 a2,2 0 0,0 0,4 h8"/>
              <path android:strokeColor="#00E676" android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M54,52 v14 M48,55 h8 a2,2 0 0,1 0,4 h-4 a2,2 0 0,0 0,4 h8"/>
          </vector>
          ''')

          w('app/src/main/res/xml/accessibility_service_config.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="500"
              android:description="@string/acc_desc"/>
          ''')

          w('app/src/main/res/values/strings.xml', '''
          <resources>
              <string name="app_name">ProfitRide</string>
              <string name="acc_desc">Citeste ofertele Bolt/Uber pentru a calcula profitul curselor</string>
          </resources>
          ''')

          w('app/src/main/res/drawable/bg_gradient.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#E3F2FD" android:endColor="#FFFFFF" android:angle="270" />
          </shape>
          ''')

          w('app/src/main/res/drawable/card_bg.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="16dp"/>
          </shape>
          ''')

          w('app/src/main/res/drawable/rounded_btn.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="30dp"/>
          </shape>
          ''')

          w('app/src/main/res/layout/activity_main.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:fillViewport="true" android:background="@drawable/bg_gradient">
              <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content">

                  <TextView android:id="@+id/tvStatus"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="#111111" android:paddingTop="24dp" android:paddingBottom="24dp"
                      android:gravity="center" android:textSize="22sp" android:textStyle="bold"
                      android:textColor="#888888" android:elevation="8dp"
                      android:text="Introdu datele cursei"/>

                  <LinearLayout android:orientation="vertical" android:padding="20dp"
                      android:layout_width="match_parent" android:layout_height="wrap_content">

                      <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:background="@drawable/card_bg" android:elevation="6dp"
                          android:outlineProvider="background" android:padding="16dp" android:layout_marginBottom="16dp">
                          <TextView android:text="Km până la preluare" android:textColor="#757575" android:textSize="12sp"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          <EditText android:id="@+id/etPickup" android:inputType="numberDecimal" android:hint="0.0"
                              android:textSize="20sp" android:textStyle="bold" android:background="@null"
                              android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      </LinearLayout>

                      <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:background="@drawable/card_bg" android:elevation="6dp"
                          android:outlineProvider="background" android:padding="16dp" android:layout_marginBottom="16dp">
                          <TextView android:text="Km cursă (cu pasager)" android:textColor="#757575" android:textSize="12sp"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          <EditText android:id="@+id/etTrip" android:inputType="numberDecimal" android:hint="0.0"
                              android:textSize="20sp" android:textStyle="bold" android:background="@null"
                              android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      </LinearLayout>

                      <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:background="@drawable/card_bg" android:elevation="6dp"
                          android:outlineProvider="background" android:padding="16dp" android:layout_marginBottom="20dp">
                          <TextView android:text="Tarif oferit (RON)" android:textColor="#757575" android:textSize="12sp"
                              android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                          <EditText android:id="@+id/etPrice" android:inputType="numberDecimal" android:hint="0.0"
                              android:textSize="20sp" android:textStyle="bold" android:background="@null"
                              android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      </LinearLayout>

                      <Button android:id="@+id/btnCalc" android:text="CALCULEAZĂ"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#4CAF50"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="8dp"
                          android:layout_width="match_parent" android:layout_height="56dp"/>

                      <TextView android:id="@+id/tvResult" android:layout_marginTop="16dp"
                          android:background="#111111" android:padding="16dp" android:elevation="4dp"
                          android:textSize="16sp" android:fontFamily="monospace"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>

                      <TextView android:text="Sumare" android:textStyle="bold" android:textSize="18sp"
                          android:layout_marginTop="24dp" android:textColor="#333333"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>

                      <LinearLayout android:orientation="horizontal" android:layout_marginTop="8dp"
                          android:layout_width="match_parent" android:layout_height="wrap_content">
                          <Button android:id="@+id/btnSumarZilnic" android:text="Zilnic"
                              android:background="@drawable/rounded_btn" android:backgroundTint="#9C27B0"
                              android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:elevation="4dp"
                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                          <Button android:id="@+id/btnSumarSaptamanal" android:text="Săpt."
                              android:background="@drawable/rounded_btn" android:backgroundTint="#4CAF50"
                              android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:elevation="4dp"
                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                          <Button android:id="@+id/btnSumarLunar" android:text="Lunar"
                              android:background="@drawable/rounded_btn" android:backgroundTint="#FF9800"
                              android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:elevation="4dp"
                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                          <Button android:id="@+id/btnSumarAnual" android:text="Anual"
                              android:background="@drawable/rounded_btn" android:backgroundTint="#2196F3"
                              android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:elevation="4dp"
                              android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>
                      </LinearLayout>

                      <Button android:id="@+id/btnVehicle" android:text="Rubrică Autovehicul"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#E91E63"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginTop="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnSettings" android:text="Setări costuri"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#2196F3"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnAccessibility" android:text="Activează citirea automată"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#FF9800"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnOverlay" android:text="Permite afișare peste alte aplicații"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#9C27B0"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnDebug" android:text="Vezi textul citit (Debug)"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#F44336"
                          android:textColor="#FFFFFF" android:elevation="6dp"
                          android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnStopAll" android:text="OPRIRE TOTALĂ APLICAȚIE"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#B71C1C"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="8dp"
                          android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          ''')

          w('app/src/main/res/layout/activity_vehicle.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@drawable/bg_gradient">
              <LinearLayout android:orientation="vertical" android:padding="20dp"
                  android:layout_width="match_parent" android:layout_height="wrap_content">
                  <TextView android:text="Alerte Expirare" android:textSize="22sp" android:textStyle="bold"
                      android:textColor="#333333" android:layout_marginBottom="20dp"
                      android:layout_width="wrap_content" android:layout_height="wrap_content"/>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="RCA" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etRca" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="RCA Persoane" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etRcaPersoane" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="RCA Bagaje" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etRcaBagaje" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="ITP" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etItp" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="Stingător" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etStingator" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="Trusă Medicală" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etTrusa" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="Copie Conformă" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etCopieConforma" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="Ecusoane" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etEcusoane" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"
                      android:padding="12dp" android:layout_marginBottom="8dp">
                      <TextView android:text="Fișă Medicală" android:textStyle="bold" android:textColor="#E91E63" android:textSize="12sp"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      <EditText android:id="@+id/etFisaMedicala" android:focusable="false" android:clickable="true" android:hint="Alege data"
                          android:inputType="none" android:background="@null" android:textStyle="bold"
                          android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  </LinearLayout>

                  <LinearLayout android:orientation="horizontal" android:layout_marginTop="24dp"
                      android:layout_width="match_parent" android:layout_height="wrap_content">
                      <Button android:id="@+id/btnSaveVehicle" android:text="SALVEAZĂ"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#4CAF50"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_weight="1" android:layout_width="0dp" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnResetVehicle" android:text="RESET"
                          android:background="@drawable/rounded_btn" android:backgroundTint="#F44336"
                          android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                          android:layout_marginLeft="12dp" android:layout_weight="1" android:layout_width="0dp" android:layout_height="wrap_content"/>
                  </LinearLayout>
              </LinearLayout>
          </ScrollView>
          ''')

          w('app/src/main/res/layout/activity_summary.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical" android:padding="24dp"
              android:background="@drawable/bg_gradient"
              android:layout_width="match_parent" android:layout_height="match_parent">
              <TextView android:id="@+id/tvSummaryTitle" android:textSize="22sp" android:textStyle="bold"
                  android:textColor="#333333" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginBottom="24dp"/>
              <TextView android:id="@+id/tvSummaryContent" android:textSize="18sp" android:textColor="#111111"
                  android:fontFamily="monospace" android:background="#FFFFFF" android:padding="20dp" android:elevation="8dp"
                  android:lineSpacingExtra="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_marginBottom="24dp"/>
              <Button android:id="@+id/btnResetSummary" android:text="RESETEAZĂ DATELE"
                  android:background="@drawable/rounded_btn" android:backgroundTint="#F44336"
                  android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="6dp"
                  android:layout_width="match_parent" android:layout_height="wrap_content"/>
