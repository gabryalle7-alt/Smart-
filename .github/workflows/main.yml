          package ro.profitride
          import android.os.Bundle
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import androidx.appcompat.app.AppCompatActivity

          class SettingsActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)
                  val p = getSharedPreferences("cfg", MODE_PRIVATE)
                  val f = findViewById<EditText>(R.id.etFuelPrice); val c = findViewById<EditText>(R.id.etConsumption)
                  val cm = findViewById<EditText>(R.id.etCommission); val ex = findViewById<EditText>(R.id.etExtraCost)
                  val mk = findViewById<EditText>(R.id.etMinPerKm); val mh = findViewById<EditText>(R.id.etMinPerHour)
                  val av = findViewById<EditText>(R.id.etAvgSpeed); val cb = findViewById<CheckBox>(R.id.cbTtsEnabled)
                  f.setText(p.getFloat("fuelPrice", 7.5f).toString()); c.setText(p.getFloat("consumption", 7f).toString())
                  cm.setText(p.getFloat("commission", 20f).toString()); ex.setText(p.getFloat("extraCost", 0.5f).toString())
                  mk.setText(p.getFloat("minPerKm", 2.5f).toString()); mh.setText(p.getFloat("minPerHour", 45f).toString())
                  av.setText(p.getFloat("avgSpeedKmh", 25f).toString()); cb.isChecked = p.getBoolean("ttsEnabled", true)
                  findViewById<Button>(R.id.btnSave).setOnClickListener {
                      p.edit().putFloat("fuelPrice", f.text.toString().toFloatOrNull() ?: 7.5f)
                          .putFloat("consumption", c.text.toString().toFloatOrNull() ?: 7f)
                          .putFloat("commission", cm.text.toString().toFloatOrNull() ?: 20f)
                          .putFloat("extraCost", ex.text.toString().toFloatOrNull() ?: 0.5f)
                          .putFloat("minPerKm", mk.text.toString().toFloatOrNull() ?: 2.5f)
                          .putFloat("minPerHour", mh.text.toString().toFloatOrNull() ?: 45f)
                          .putFloat("avgSpeedKmh", av.text.toString().toFloatOrNull() ?: 25f)
                          .putBoolean("ttsEnabled", cb.isChecked).apply()
                      finish()
                  }
              }
          }
          ''')

