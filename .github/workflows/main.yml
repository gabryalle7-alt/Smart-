          w('app/src/main/java/ro/profitride/OfferParser.kt', '''
          package ro.profitride

          object OfferParser {
              data class Offer(
                  val priceRon: Float,
                  val pickupKm: Float,
                  val tripKm: Float,
                  val pickupMinutes: Int,
                  val tripMinutes: Int
              )

              fun parse(text: String, avgSpeedKmh: Float = 25f): Offer? {
                  var price = Regex("""(\\d+(?:[.,]\\d{1,2})?)\\s*(?:RON|lei)""", RegexOption.IGNORE_CASE).findAll(text).mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }.filter { it in 3f..2000f }.maxOrNull()
                  
                  if (price == null) {
                      price = Regex("""(\\d+(?:[.,]\\d{1,2})?)""").findAll(text)
                          .mapNotNull { m ->
                              val valStr = m.groupValues[1]
                              val after = text.substring(m.range.last + 1).take(10).lowercase()
                              if (!after.contains("km") && !after.contains("min") && !after.contains("ron")) {
                                  valStr.replace(',', '.').toFloatOrNull()
                              } else null
                          }
                          .filter { it in 5f..500f }
                          .maxOrNull()
                  }
                  
                  if (price == null) return null

                  val kms = Regex("""(\\d+(?:[.,]\\d+)?)\\s*km""", RegexOption.IGNORE_CASE)
                      .findAll(text).map { it.groupValues[1].replace(',', '.').toFloat() }.toList()
                  
                  val mins = Regex("""(\\d+)\\s*min""", RegexOption.IGNORE_CASE)
                      .findAll(text).map { it.groupValues[1].toInt() }.toList()

                  if (kms.isEmpty()) return null

                  var pickupKm = 0f
                  var tripKm = 0f
                  var pickupMin = 0
                  var tripMin = 0

                  if (kms.size >= 2) {
                      pickupKm = kms[0]
                      tripKm = kms[1]
                      if (pickupKm > tripKm * 2.5f) {
                          val temp = pickupKm; pickupKm = tripKm; tripKm = temp
                      }
                  } else if (kms.size == 1) {
                      tripKm = kms[0]
                  }

                  if (mins.size >= 2) {
                      pickupMin = mins[0]
                      tripMin = mins[1]
                      if (pickupMin > tripMin * 3) { val t = pickupMin; pickupMin = tripMin; tripMin = t }
                  } else if (mins.size == 1) {
                      tripMin = mins[0]
                  }

                  if (tripMin == 0) tripMin = ((tripKm / avgSpeedKmh) * 60).toInt()
                  if (pickupMin == 0) pickupMin = ((pickupKm / avgSpeedKmh) * 60).toInt()

                  return Offer(price, pickupKm, tripKm, pickupMin, tripMin)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/Calc.kt', '''
          package ro.profitride

          import android.content.Context
          import android.graphics.Color

          object Calc {
              data class Result(val text: String, val color: Int, val profitPerKm: Float, val profitPerHour: Float, val speech: String)
              private val GREEN  = Color.parseColor("#4CAF50")
              private val YELLOW = Color.parseColor("#FFEB3B")
              private val RED    = Color.parseColor("#FF5252")

              fun compute(ctx: Context, o: OfferParser.Offer): Result {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val fuelPrice    = p.getFloat("fuelPrice", 7.5f)
                  val consumption  = p.getFloat("consumption", 7f)
                  val commission   = p.getFloat("commission", 20f)
                  val extraPerKm   = p.getFloat("extraCost", 0.5f)
                  val minPerKm     = p.getFloat("minPerKm", 2.5f)
                  val minPerHour   = p.getFloat("minPerHour", 45f)

                  val totalKm  = o.pickupKm + o.tripKm
                  val totalMin = o.pickupMinutes + o.tripMinutes

                  val commissionCut = o.priceRon * commission / 100f
                  val fuelCost      = totalKm / 100f * consumption * fuelPrice
                  val extraCost     = totalKm * extraPerKm
                  
                  val totalExpenses = commissionCut + fuelCost + extraCost
                  val netProfit     = o.priceRon - totalExpenses
                  
                  val perKm     = if (totalKm > 0f) netProfit / totalKm else 0f
                  val perHour   = if (totalMin > 0) netProfit / (totalMin / 60f) else 0f

                  val (label, color) = when {
                      perHour >= minPerHour * 1.2f && perKm >= minPerKm -> "PROFITABIL"   to GREEN
                      perHour >= minPerHour        && perKm >= minPerKm * 0.8f -> "MEDIU" to YELLOW
                      else -> "NEPROFITABIL" to RED
                  }

                  val text = """
                      [%s]
                      ---------------------
                      %.2f RON/km
                      %.0f RON/oră
                      ---------------------
                      Cheltuieli: %.2f RON
                      Profit net: %.2f RON
                      ---------------------
                      Total: %.1f km | %d min
                  """.trimIndent().format(label, perKm, perHour, totalExpenses, netProfit, totalKm, totalMin)

                  val speech = when (label) {
                      "PROFITABIL" -> "Profitabil. ${perKm.toInt()} lei pe kilometru, ${perHour.toInt()} lei pe ora."
                      "MEDIU"      -> "Mediu. ${perHour.toInt()} lei pe ora."
                      else         -> "Neprofitabil."
                  }
                  return Result(text, color, perKm, perHour, speech)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/MainActivity.kt', '''
          package ro.profitride

          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.Editable
          import android.text.TextWatcher
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var etPickup: EditText
              private lateinit var etTrip: EditText
              private lateinit var etPrice: EditText
              private lateinit var tvStatus: TextView
              private lateinit var tvResult: TextView

              private val handler = Handler(Looper.getMainLooper())
              private val calcRunnable = Runnable { calculate() }
              private var ignoreWatcher = false

              private val watcher = object : TextWatcher {
                  override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                  override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                      if (ignoreWatcher) return
                      handler.removeCallbacks(calcRunnable)
                      handler.postDelayed(calcRunnable, 250L)
                  }
                  override fun afterTextChanged(s: Editable?) {}
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  etPickup = findViewById(R.id.etPickup)
                  etTrip   = findViewById(R.id.etTrip)
                  etPrice  = findViewById(R.id.etPrice)
                  tvStatus = findViewById(R.id.tvStatus)
                  tvResult = findViewById(R.id.tvResult)

                  etPickup.addTextChangedListener(watcher)
                  etTrip.addTextChangedListener(watcher)
                  etPrice.addTextChangedListener(watcher)

                  findViewById<Button>(R.id.btnCalc).setOnClickListener { calculate() }
                  findViewById<Button>(R.id.btnSettings).setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }
                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) Toast.makeText(this, "Acorda mai intai permisiunea Afisare peste alte aplicatii", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  findViewById<Button>(R.id.btnOverlay).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                  }
                  findViewById<Button>(R.id.btnDebug).setOnClickListener {
                      val debugContent = try {
                          openFileInput("debug.txt").bufferedReader().use { it.readText() }
                      } catch (e: Exception) {
                          "Nu exista date. Deschide Bolt, asteapta o oferta, apoi revino aici."
                      }
                      AlertDialog.Builder(this)
                          .setTitle("Ce a citit aplicatia:")
                          .setMessage(debugContent.take(5000))
                          .setPositiveButton("OK", null)
                          .show()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val offers = getSharedPreferences("offers", MODE_PRIVATE)
                  if (offers.getBoolean("fresh", false)) {
                      ignoreWatcher = true
                      etPickup.setText(offers.getFloat("pickupKm", 0f).toString())
                      etTrip.setText(offers.getFloat("tripKm", 0f).toString())
                      etPrice.setText(offers.getFloat("price", 0f).toString())
                      ignoreWatcher = false
                      offers.edit().putBoolean("fresh", false).apply()
                      calculate()
                  }
              }

              private fun calculate() {
                  val pp = etPickup.text.toString().toFloatOrNull() ?: 0f
                  val t  = etTrip.text.toString().toFloatOrNull() ?: 0f
                  val pr = etPrice.text.toString().toFloatOrNull() ?: 0f
                  if (pp == 0f && t == 0f && pr == 0f) {
                      tvStatus.text = "Introdu datele cursei"
                      tvStatus.setTextColor(Color.parseColor("#888888"))
                      tvResult.text = ""
                      return
                  }
                  val offer = OfferParser.Offer(pr, pp, t, 0, 0)
                  val r = Calc.compute(this, offer)
                  tvStatus.text = r.text.substringBefore('\\n')
                  tvStatus.setTextColor(r.color)
                  tvResult.text = r.text
                  tvResult.setTextColor(r.color)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(calcRunnable)
                  super.onDestroy()
              }
          }
          ''')

