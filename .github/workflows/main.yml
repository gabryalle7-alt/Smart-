          w('app/src/main/java/ro/profitride/OfferReader.kt', r'''
          package ro.profitride
          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import java.util.Locale

          class OfferReader : AccessibilityService() {
              companion object { var isStopped = false }
              private var overlay: View? = null
              private var bubbleView: View? = null
              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private val autoDismiss = Runnable { removeOverlay() }
              private var tts: TextToSpeech? = null
              private var vibrator: Vibrator? = null
              private val sb = StringBuilder(2048)
              private var lastParseAt = 0L
              private var lastKey = ""
              private var pendingOffer: OfferParser.Offer? = null
              private var pendingResult: Calc.Result? = null

              private val screenOff = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) { if (i?.action == Intent.ACTION_SCREEN_OFF) removeOverlay() }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  vibrator = if (Build.VERSION.SDK_INT >= 31) (getSystemService(VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                      else @Suppress("DEPRECATION") getSystemService(VIBRATOR_SERVICE) as Vibrator
                  tts = TextToSpeech(this) { status -> if (status == TextToSpeech.SUCCESS) tts?.language = Locale("ro", "RO") }
                  try { ContextCompat.registerReceiver(this, screenOff, IntentFilter(Intent.ACTION_SCREEN_OFF), ContextCompat.RECEIVER_NOT_EXPORTED) } catch (_: Exception) {}
                  if (!isStopped) showBubble()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (isStopped) return
                  if (event == null) return
                  val pkg = event.packageName?.toString()?.lowercase() ?: return
                  val known = listOf("bolt", "uber", "free", "mtakso", "ubercab", "clever", "taxi")
                  if (known.none { pkg.contains(it) }) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastParseAt < 500L) return
                  lastParseAt = now
                  val root = rootInActiveWindow ?: return
                  sb.setLength(0); collect(root, sb, 0)
                  val raw = sb.toString().lowercase()
                  if (raw.isEmpty()) return
                  if (raw.contains("accept")) {
                      val offer = OfferParser.parse(raw, avgSpeed())
                      if (offer != null) {
                          val key = "${offer.priceRon}|${offer.pickupKm}|${offer.tripKm}"
                          if (key != lastKey) {
                              lastKey = key
                              val result = Calc.compute(this, offer)
                              pendingOffer = offer; pendingResult = result
                              showOverlay(result); speak(result); vibrate(result.color)
                          }
                      }
                  }
                  val finished = raw.contains("finalizează") || raw.contains("finalizeaza") || raw.contains("încheie") ||
                                 raw.contains("incheie") || raw.contains("ați ajuns") || raw.contains("ati ajuns") ||
                                 raw.contains("end trip") || raw.contains("trip completed")
                  if (finished && pendingOffer != null && pendingResult != null) {
                      val o = pendingOffer!!; val r = pendingResult!!
                      try {
                          openFileOutput("offers.csv", Context.MODE_APPEND).bufferedWriter().use {
                              it.appendLine("${System.currentTimeMillis()},${o.priceRon},${o.pickupKm},${o.tripKm},${r.profitPerKm},${r.profitPerHour},${r.totalExpenses},${r.netProfit}")
                          }
                          handler.post { Toast.makeText(this, "Cursă salvată în sumar!", Toast.LENGTH_LONG).show() }
                      } catch (_: Exception) {}
                      pendingOffer = null; pendingResult = null
                  }
              }

              private fun avgSpeed(): Float {
                  val v = getSharedPreferences("cfg", MODE_PRIVATE).getFloat("avgSpeedKmh", 25f)
                  return if (v >= 5f) v else 25f
              }
              private fun collect(node: AccessibilityNodeInfo?, sb: StringBuilder, depth: Int) {
                  if (node == null || depth > 40 || sb.length > 20000) return
                  node.text?.toString()?.trim()?.let { if (it.isNotEmpty()) sb.append(it).append('\n') }
                  node.contentDescription?.toString()?.trim()?.let { if (it.isNotEmpty()) sb.append(it).append('\n') }
                  for (i in 0 until node.childCount) collect(node.getChild(i), sb, depth + 1)
              }
              private fun speak(r: Calc.Result) {
                  if (!getSharedPreferences("cfg", MODE_PRIVATE).getBoolean("ttsEnabled", true)) return
                  tts?.speak(r.speech, TextToSpeech.QUEUE_FLUSH, null, "offer")
              }
              private fun vibrate(color: Int) {
                  val v = vibrator ?: return
                  val ms = when (color) { Color.parseColor("#4CAF50") -> 120L; Color.parseColor("#FFEB3B") -> 250L; else -> 500L }
                  if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  else @Suppress("DEPRECATION") v.vibrate(ms)
              }

              private fun showBubble() {
                  if (bubbleView != null) return
                  val sizePx = (56 * resources.displayMetrics.density).toInt()
                  val bubble = View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#80FF0000"))
                          setStroke((2 * resources.displayMetrics.density).toInt(), Color.RED)
                      }
                      setOnTouchListener(bubbleDragListener())
                  }
                  val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  val params = WindowManager.LayoutParams(sizePx, sizePx, type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT).apply { gravity = Gravity.TOP or Gravity.START; x = 30; y = 400 }
                  try { wm.addView(bubble, params); bubbleView = bubble; bubble.tag = params } catch (_: Exception) {}
              }

              private fun bubbleDragListener(): View.OnTouchListener {
                  var sX = 0; var sY = 0; var tX = 0f; var tY = 0f
                  return View.OnTouchListener { v, e ->
                      val p = v.tag as? WindowManager.LayoutParams ?: return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sX = p.x; sY = p.y; tX = e.rawX; tY = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              p.x = sX + (e.rawX - tX).toInt(); p.y = sY + (e.rawY - tY).toInt()
                              try { wm.updateViewLayout(v, p) } catch (_: Exception) {}; true
                          }
                          else -> false
                      }
                  }
              }
              private fun removeBubble() { bubbleView?.let { try { wm.removeView(it) } catch (_: Exception) {} }; bubbleView = null }

              private fun showOverlay(r: Calc.Result) {
                  removeOverlay()
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#E6000000")); cornerRadius = 50f; setStroke(6, r.color)
                      }
                      setPadding(50, 40, 50, 40); elevation = 25f; setOnTouchListener(dragListener())
                  }
                  val close = TextView(this).apply {
                      text = "\u00d7"; setTextColor(Color.WHITE); textSize = 26f
                      gravity = Gravity.END; setOnClickListener { removeOverlay() }
                  }
                  val body = TextView(this).apply {
                      text = r.text; setTextColor(r.color); textSize = 20f
                      typeface = Typeface.DEFAULT_BOLD; setShadowLayer(6f, 0f, 3f, Color.BLACK)
                  }
                  container.addView(close); container.addView(body)
                  val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                  val params = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 20; y = 150
                  }
                  try { wm.addView(container, params); overlay = container; container.tag = params; handler.postDelayed(autoDismiss, 20_000L) } catch (_: Exception) {}
              }

              private fun dragListener(): View.OnTouchListener {
                  var sX = 0; var sY = 0; var tX = 0f; var tY = 0f; var moved = false
                  return View.OnTouchListener { v, e ->
                      val p = v.tag as? WindowManager.LayoutParams ?: return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sX = p.x; sY = p.y; tX = e.rawX; tY = e.rawY; moved = false; true }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tX).toInt(); val dy = (e.rawY - tY).toInt()
                              if (dx * dx + dy * dy > 100) moved = true
                              if (moved) { p.x = sX + dx; p.y = sY + dy; try { wm.updateViewLayout(v, p) } catch (_: Exception) {} }
                              true
                          }
                          MotionEvent.ACTION_UP -> { if (!moved) removeOverlay(); true }
                          else -> false
                      }
                  }
              }
              private fun removeOverlay() {
                  handler.removeCallbacks(autoDismiss)
                  overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  overlay = null
              }
              override fun onInterrupt() { removeOverlay(); removeBubble() }
              override fun onDestroy() {
                  removeOverlay(); removeBubble()
                  try { unregisterReceiver(screenOff) } catch (_: Exception) {}
                  tts?.stop(); tts?.shutdown(); tts = null
                  super.onDestroy()
              }
          }
          ''')
          PYEOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfitRide-APK
          path: app/build/outputs/apk/debug/app-debug.apk
