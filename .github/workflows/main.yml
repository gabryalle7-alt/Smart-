          w('app/src/main/java/ro/profitride/ExpiryWorker.kt', '''
          package ro.profitride
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import java.util.Calendar
          import java.util.concurrent.TimeUnit

          class ExpiryWorker(context: Context, params: WorkerParameters) : Worker(context, params) {
              override fun doWork(): Result {
                  val prefs = applicationContext.getSharedPreferences("vehicle", Context.MODE_PRIVATE)
                  val items = mapOf("rca" to "RCA", "rcaPers" to "RCA Persoane", "rcaBag" to "RCA Bagaje", "itp" to "ITP",
                      "stingator" to "Stingător", "trusa" to "Trusă Medicală", "copie" to "Copie Conformă",
                      "ecusoane" to "Ecusoane", "fisa" to "Fișă Medicală")
                  val today = Calendar.getInstance().apply { set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0) }.timeInMillis
                  for ((key, label) in items) {
                      val exp = prefs.getLong(key, 0L)
                      if (exp > 0) {
                          val days = TimeUnit.MILLISECONDS.toDays(exp - today)
                          if (days == 30L || days == 15L || days == 10L || days == 3L) sendNotif(label, days.toInt())
                      }
                  }
                  return Result.success()
              }
              private fun sendNotif(label: String, days: Int) {
                  val ch = "vehicle_alerts"
                  val nm = applicationContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) nm.createNotificationChannel(NotificationChannel(ch, "Alerte Auto", NotificationManager.IMPORTANCE_HIGH))
                  val n = NotificationCompat.Builder(applicationContext, ch)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle("Atenție! $label expiră curând!")
                      .setContentText("Mai ai $days zile până la expirarea: $label.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).build()
                  nm.notify(label.hashCode(), n)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/SummaryActivity.kt', '''
          package ro.profitride
          import android.app.AlertDialog
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Calendar

          class SummaryActivity : AppCompatActivity() {
              private lateinit var period: String
              private lateinit var content: TextView
              private lateinit var prefs: android.content.SharedPreferences
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_summary)
                  period = intent.getStringExtra("PERIOADA") ?: "WEEK"
                  findViewById<TextView>(R.id.tvSummaryTitle).text = when(period) {
                      "DAY" -> "Sumar Zilnic (De azi)"; "WEEK" -> "Sumar Săptămânal (De luni)"
                      "MONTH" -> "Sumar Lunar"; "YEAR" -> "Sumar Anual"; else -> "Sumar"
                  }
                  content = findViewById(R.id.tvSummaryContent)
                  prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  loadSummary()
                  findViewById<Button>(R.id.btnResetSummary).setOnClickListener {
                      AlertDialog.Builder(this).setTitle("Reset").setMessage("Ștergi datele pentru această perioadă?")
                          .setPositiveButton("Da") { _, _ -> prefs.edit().putLong("reset_$period", System.currentTimeMillis()).apply(); loadSummary() }
                          .setNegativeButton("Nu", null).show()
                  }
              }
              private fun loadSummary() {
                  val (r, e, n) = calc()
                  content.text = "Total Încasări: %.2f RON\nTotal Cheltuieli: %.2f RON\n---------------------\nPROFIT NET: %.2f RON".format(r, e, n)
              }
              private fun getStart(): Long {
                  val cal = Calendar.getInstance()
                  when (period) {
                      "DAY" -> { cal.set(Calendar.HOUR_OF_DAY, 0); cal.set(Calendar.MINUTE, 0); cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0) }
                      "WEEK" -> { cal.set(Calendar.DAY_OF_WEEK, cal.firstDayOfWeek); cal.set(Calendar.HOUR_OF_DAY, 0); cal.set(Calendar.MINUTE, 0); cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0) }
                      "MONTH" -> { cal.set(Calendar.DAY_OF_MONTH, 1); cal.set(Calendar.HOUR_OF_DAY, 0); cal.set(Calendar.MINUTE, 0); cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0) }
                      "YEAR" -> { cal.set(Calendar.DAY_OF_YEAR, 1); cal.set(Calendar.HOUR_OF_DAY, 0); cal.set(Calendar.MINUTE, 0); cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0) }
                  }
                  return cal.timeInMillis
              }
              private fun calc(): Triple<Float, Float, Float> {
                  var rev = 0f; var exp = 0f; var net = 0f
                  val eff = maxOf(getStart(), prefs.getLong("reset_$period", 0L))
                  try {
                      openFileInput("offers.csv").bufferedReader().useLines { l ->
                          l.forEach { line ->
                              val p = line.split(",")
                              if (p.size >= 8 && (p[0].toLongOrNull() ?: 0L) >= eff) {
                                  rev += p[1].toFloatOrNull() ?: 0f; exp += p[6].toFloatOrNull() ?: 0f; net += p[7].toFloatOrNull() ?: 0f
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return Triple(rev, exp, net)
              }
          }
          ''')

