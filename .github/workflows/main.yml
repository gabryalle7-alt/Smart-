          w('app/src/main/java/ro/profitride/ExpiryWorker.kt', '''
          package ro.profitride

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.work.Worker
          import androidx.work.WorkerParameters
          import java.util.Calendar
          import java.util.concurrent.TimeUnit

          class ExpiryWorker(context: Context, workerParams: WorkerParameters) : Worker(context, workerParams) {
              override fun doWork(): Result {
                  val prefs = applicationContext.getSharedPreferences("vehicle", Context.MODE_PRIVATE)
                  val items = mapOf(
                      "rca" to "RCA",
                      "rcaPers" to "RCA Persoane",
                      "rcaBag" to "RCA Bagaje",
                      "itp" to "ITP",
                      "stingator" to "Stingător",
                      "trusa" to "Trusă Medicală"
                  )

                  val today = Calendar.getInstance().apply {
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }.timeInMillis

                  for ((key, label) in items) {
                      val expiry = prefs.getLong(key, 0L)
                      if (expiry > 0) {
                          val diff = expiry - today
                          val days = TimeUnit.MILLISECONDS.toDays(diff)
                          
                          if (days == 30L || days == 15L || days == 10L || days == 3L) {
                              sendNotification(label, days.toInt())
                          }
                      }
                  }
                  return Result.success()
              }

              private fun sendNotification(label: String, daysLeft: Int) {
                  val channelId = "vehicle_alerts"
                  val notificationManager = applicationContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Alerte Autovehicul", NotificationManager.IMPORTANCE_HIGH)
                      notificationManager.createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(applicationContext, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle("Atenție! $label expiră curând!")
                      .setContentText("Mai ai $daysLeft zile până la expirarea documentului: $label.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .build()

                  notificationManager.notify(label.hashCode(), notification)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/SummaryActivity.kt', '''
          package ro.profitride

          import android.app.AlertDialog
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.util.Calendar

          class SummaryActivity : AppCompatActivity() {
              
              private lateinit var period: String
              private lateinit var title: TextView
              private lateinit var content: TextView
              private lateinit var prefs: android.content.SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_summary)

                  period = intent.getStringExtra("PERIOADA") ?: "WEEK"
                  title = findViewById(R.id.tvSummaryTitle)
                  content = findViewById(R.id.tvSummaryContent)
                  prefs = getSharedPreferences("cfg", MODE_PRIVATE)

                  title.text = when(period) {
                      "DAY" -> "Sumar Zilnic (De azi)"
                      "WEEK" -> "Sumar Săptămânal (De luni)"
                      "MONTH" -> "Sumar Lunar (De luna aceasta)"
                      "YEAR" -> "Sumar Anual (De anul acesta)"
                      else -> "Sumar"
                  }

                  loadSummary()

                  findViewById<Button>(R.id.btnResetSummary).setOnClickListener {
                      AlertDialog.Builder(this)
                          .setTitle("Confirmare Reset")
                          .setMessage("Sigur vrei să ștergi datele pentru această perioadă? (Această acțiune nu poate fi anulată)")
                          .setPositiveButton("Da, șterge") { _, _ ->
                              prefs.edit().putLong("reset_$period", System.currentTimeMillis()).apply()
                              loadSummary()
                          }
                          .setNegativeButton("Anulează", null)
                          .show()
                  }
              }

              private fun loadSummary() {
                  val (totalRevenue, totalExpenses, totalNet) = calculateSummary()
                  content.text = """
                      Total Încasări: %.2f RON
                      Total Cheltuieli: %.2f RON
                      ---------------------
                      PROFIT NET: %.2f RON
                  """.trimIndent().format(totalRevenue, totalExpenses, totalNet)
              }

              private fun getPeriodStartTime(): Long {
                  val cal = Calendar.getInstance()
                  when (period) {
                      "DAY" -> {
                          cal.set(Calendar.HOUR_OF_DAY, 0)
                          cal.set(Calendar.MINUTE, 0)
                          cal.set(Calendar.SECOND, 0)
                          cal.set(Calendar.MILLISECOND, 0)
                      }
                      "WEEK" -> {
                          cal.set(Calendar.DAY_OF_WEEK, cal.firstDayOfWeek)
                          cal.set(Calendar.HOUR_OF_DAY, 0)
                          cal.set(Calendar.MINUTE, 0)
                          cal.set(Calendar.SECOND, 0)
                          cal.set(Calendar.MILLISECOND, 0)
                      }
                      "MONTH" -> {
                          cal.set(Calendar.DAY_OF_MONTH, 1)
                          cal.set(Calendar.HOUR_OF_DAY, 0)
                          cal.set(Calendar.MINUTE, 0)
                          cal.set(Calendar.SECOND, 0)
                          cal.set(Calendar.MILLISECOND, 0)
                      }
                      "YEAR" -> {
                          cal.set(Calendar.DAY_OF_YEAR, 1)
                          cal.set(Calendar.HOUR_OF_DAY, 0)
                          cal.set(Calendar.MINUTE, 0)
                          cal.set(Calendar.SECOND, 0)
                          cal.set(Calendar.MILLISECOND, 0)
                      }
                  }
                  return cal.timeInMillis
              }

              private fun calculateSummary(): Triple<Float, Float, Float> {
                  var rev = 0f; var exp = 0f; var net = 0f
                  
                  val periodStart = getPeriodStartTime()
                  val resetTime = prefs.getLong("reset_$period", 0L)
                  val effectiveStart = maxOf(periodStart, resetTime)

                  try {
                      openFileInput("offers.csv").bufferedReader().useLines { lines ->
                          lines.forEach { line ->
                              val parts = line.split(",")
                              if (parts.size >= 8) {
                                  val ts = parts[0].toLongOrNull() ?: 0L
                                  if (ts >= effectiveStart) {
                                      val price = parts[1].toFloatOrNull() ?: 0f
                                      val e = parts[6].toFloatOrNull() ?: 0f
                                      val n = parts[7].toFloatOrNull() ?: 0f
                                      rev += price; exp += e; net += n
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return Triple(rev, exp, net)
              }
          }
          ''')

