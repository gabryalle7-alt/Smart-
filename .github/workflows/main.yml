name: Build ProfitRide APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create project files with Python
        run: |
          python3 - <<'PYEOF'
          import os

          def w(path, text):
              d = os.path.dirname(path)
              if d: os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text.strip() + '\n')

          w('README.md', '''
          # ProfitRide
          Aplicatie pentru calculat profitul curselor.
          ''')

          w('local.properties', f'sdk.dir={os.environ["ANDROID_HOME"]}')

          w('gradle.properties', '''
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          ''')

          w('settings.gradle', '''
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ProfitRide"
          include ':app'
          ''')

          w('build.gradle', '''
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ''')

          w('app/build.gradle', '''
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'ro.profitride'
              compileSdk 34
              defaultConfig {
                  applicationId "ro.profitride"
                  minSdk 24
                  targetSdk 34
                  versionCode 9
                  versionName "2.3"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          ''')

          w('app/src/main/AndroidManifest.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_car"
                  android:label="ProfitRide"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity"/>
                  <activity android:name=".SetupActivity"/>
                  <service
                      android:name=".OfferReader"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
