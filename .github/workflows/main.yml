          w('app/src/main/java/ro/profitride/OfferParser.kt', '''
          package ro.profitride

          object OfferParser {
              data class Offer(
                  val priceRon: Float,
                  val pickupKm: Float,
                  val tripKm: Float,
                  val pickupMinutes: Int,
                  val tripMinutes: Int
              )

              fun parse(text: String, avgSpeedKmh: Float = 25f): Offer? {
                  var price = Regex("""(\\d+(?:[.,]\\d{1,2})?)\\s*(?:RON|lei)""", RegexOption.IGNORE_CASE).findAll(text).mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }.filter { it in 3f..2000f }.maxOrNull()
                  
                  if (price == null) {
                      price = Regex("""(\\d+(?:[.,]\\d{1,2})?)""").findAll(text)
                          .mapNotNull { m ->
                              val valStr = m.groupValues[1]
                              val after = text.substring(m.range.last + 1).take(10).lowercase()
                              if (!after.contains("km") && !after.contains("min") && !after.contains("ron")) {
                                  valStr.replace(',', '.').toFloatOrNull()
                              } else null
                          }
                          .filter { it in 5f..500f }
                          .maxOrNull()
                  }
                  
                  if (price == null) return null

                  val kms = Regex("""(\\d+(?:[.,]\\d+)?)\\s*km""", RegexOption.IGNORE_CASE)
                      .findAll(text).map { it.groupValues[1].replace(',', '.').toFloat() }.toList()
                  
                  val mins = Regex("""(\\d+)\\s*min""", RegexOption.IGNORE_CASE)
                      .findAll(text).map { it.groupValues[1].toInt() }.toList()

                  if (kms.isEmpty()) return null

                  var pickupKm = 0f
                  var tripKm = 0f
                  var pickupMin = 0
                  var tripMin = 0

                  if (kms.size >= 2) {
                      pickupKm = kms[0]
                      tripKm = kms[1]
                      if (pickupKm > tripKm * 2.5f) {
                          val temp = pickupKm; pickupKm = tripKm; tripKm = temp
                      }
                  } else if (kms.size == 1) {
                      tripKm = kms[0]
                  }

                  if (mins.size >= 2) {
                      pickupMin = mins[0]
                      tripMin = mins[1]
                      if (pickupMin > tripMin * 3) { val t = pickupMin; pickupMin = tripMin; tripMin = t }
                  } else if (mins.size == 1) {
                      tripMin = mins[0]
                  }

                  if (tripMin == 0) tripMin = ((tripKm / avgSpeedKmh) * 60).toInt()
                  if (pickupMin == 0) pickupMin = ((pickupKm / avgSpeedKmh) * 60).toInt()

                  return Offer(price, pickupKm, tripKm, pickupMin, tripMin)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/Calc.kt', '''
          package ro.profitride

          import android.content.Context
          import android.graphics.Color

          object Calc {
              data class Result(
                  val text: String, 
                  val color: Int, 
                  val profitPerKm: Float, 
                  val profitPerHour: Float,
                  val totalExpenses: Float,
                  val netProfit: Float,
                  val speech: String
              )
              private val GREEN  = Color.parseColor("#4CAF50")
              private val YELLOW = Color.parseColor("#FFEB3B")
              private val RED    = Color.parseColor("#FF5252")

              fun compute(ctx: Context, o: OfferParser.Offer): Result {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val fuelPrice    = p.getFloat("fuelPrice", 7.5f)
                  val consumption  = p.getFloat("consumption", 7f)
                  val commission   = p.getFloat("commission", 20f)
                  val extraPerKm   = p.getFloat("extraCost", 0.5f)
                  val minPerKm     = p.getFloat("minPerKm", 2.5f)
                  val minPerHour   = p.getFloat("minPerHour", 45f)

                  val totalKm  = o.pickupKm + o.tripKm
                  val totalMin = o.pickupMinutes + o.tripMinutes

                  val commissionCut = o.priceRon * commission / 100f
                  val fuelCost      = totalKm / 100f * consumption * fuelPrice
                  val extraCost     = totalKm * extraPerKm
                  
                  val totalExpenses = commissionCut + fuelCost + extraCost
                  val netProfit     = o.priceRon - totalExpenses
                  
                  val perKm     = if (totalKm > 0f) netProfit / totalKm else 0f
                  val perHour   = if (totalMin > 0) netProfit / (totalMin / 60f) else 0f

                  val (label, color) = when {
                      perHour >= minPerHour * 1.2f && perKm >= minPerKm -> "PROFITABIL"   to GREEN
                      perHour >= minPerHour        && perKm >= minPerKm * 0.8f -> "MEDIU" to YELLOW
                      else -> "NEPROFITABIL" to RED
                  }

                  val text = """
                      [%s]
                      ---------------------
                      %.2f RON/km
                      %.0f RON/oră
                      ---------------------
                      Cheltuieli: %.2f RON
                      Profit net: %.2f RON
                      ---------------------
                      Total: %.1f km | %d min
                  """.trimIndent().format(label, perKm, perHour, totalExpenses, netProfit, totalKm, totalMin)

                  val speech = when (label) {
                      "PROFITABIL" -> "Profitabil. ${perKm.toInt()} lei pe kilometru, ${perHour.toInt()} lei pe ora."
                      "MEDIU"      -> "Mediu. ${perHour.toInt()} lei pe ora."
                      else         -> "Neprofitabil."
                  }
                  return Result(text, color, perKm, perHour, totalExpenses, netProfit, speech)
              }
          }
          ''')

